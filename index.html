.cloud{

}

.cloud:before,

    content:"";

    border-radius:50%;
}

.cloud1{
    width:180px;
    height:55px;

}

    width:80px;
    height:80px;

}

.cloud1:after{

}

}

.header{

.progress-bar{

/* CARD */
.card{

.location{

.picture{

    font-size:120px;

@keyframes float{

}

.answer{

.answer:focus{

const questions = questionBank.map(item => ({
    location:"🎲 PETUALANGAN",
    picture:item[0],

    answers:item[2]
}));


let current = 0;
let score = 0;
let locked = false;


/* =========================
   TAMPILKAN SOAL
========================= */

function showQuestion(){

    const q = questions[current];

    document.getElementById("location").textContent =
        q.location;

    document.getElementById("picture").textContent =
        q.picture;

    document.getElementById("question").innerHTML =
        q.question +
        ' <span class="blank">.........</span>';

    document.getElementById("number").textContent =
        current + 1;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("message").textContent = "";

    document.getElementById("message").className =
        "message";

    document.getElementById("check").style.display =
        "inline-block";

    document.getElementById("next").style.display =
        "none";

    locked = false;

    updateProgress();

    setTimeout(()=>{
        document.getElementById("answer").focus();
    },100);

}


/* =========================
   CEK JAWABAN
========================= */

function checkAnswer(){

    if(locked) return;

    const input =
        document.getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    const message =
        document.getElementById("message");

    if(input === ""){

        message.textContent =
            "😊 Ayo isi jawabannya dulu!";

        message.className =
            "message wrong";

        return;
    }


    const correct =
        questions[current].answers
        .some(answer => answer === input);


    if(correct){

        locked = true;

        score += 10;

        document.getElementById("score")
            .textContent = score;

        message.textContent =
            "🎉 BENAR! KAMU HEBAT! ⭐";

        message.className =
            "message correct";

        document.getElementById("answer")
            .disabled = true;

        document.getElementById("check")
            .style.display = "none";

        document.getElementById("next")
            .style.display = "inline-block";

        createConfetti();

    }else{

        message.textContent =
            "🤔 Belum tepat... Coba lagi ya!";

        message.className =
            "message wrong";

        document.getElementById("answer")
            .select();
    }

}


/* =========================
   SOAL BERIKUTNYA
========================= */

function nextQuestion(){

    current++;

    if(current >= questions.length){

        finishGame();

    }else{

        showQuestion();

    }

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const percent =
        ((current) / questions.length) * 100;

    document.getElementById("progress")
        .style.width = percent + "%";

}

========================= */

function finishGame(){

    document.getElementById("gameCard")
        .style.display = "none";

    document.querySelector(".progress-wrap")
        .style.display = "none";

    document.getElementById("finish")
        .style.display = "block";

    document.getElementById("finalScore")
        .textContent = score;

    createConfetti();
    createConfetti();
    createConfetti();

}

========================= */

function restartGame(){

    current = 0;

    document.getElementById("score")
        .textContent = 0;

    document.getElementById("gameCard")
        .style.display = "block";

    document.querySelector(".progress-wrap")
        .style.display = "block";

    document.getElementById("finish")
        .style.display = "none";

    showQuestion();

}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    const symbols = [
        "⭐",
        "🌟",
        "🎉",
        "✨",
        "💛",
        "🎈"
    ];

    for(let i=0;i<30;i++){

        const el =
            document.createElement("div");

        el.className = "confetti";

        el.textContent =
            symbols[Math.floor(
                Math.random()*symbols.length
            )];

        el.style.left =
            Math.random()*100 + "vw";

        el.style.animationDuration =
            (1.5 + Math.random()*1.5) + "s";

        el.style.fontSize =
            (15 + Math.random()*20) + "px";

        document.body.appendChild(el);

        setTimeout(()=>{
            el.remove();
        },3000);

    }

}
